name: Validate and Deploy Pages
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run check
      - run: node scripts/smoke-tmdb.mjs
      - run: npm run build
      - name: Smoke built site on localhost
        run: |
          npm run dev -- --port=4173 > /tmp/pinflix-serve.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in {1..20}; do
            if curl -fsS http://127.0.0.1:4173/ -o /tmp/pinflix-index.html; then break; fi
            sleep 1
          done
          grep -q 'pinflix-embedded-catalogue' /tmp/pinflix-index.html
          curl -fsS http://127.0.0.1:4173/assets/data/tmdb-catalogue.json -o /tmp/pinflix-catalogue.json
          node -e "const d=require('/tmp/pinflix-catalogue.json'); if (!Array.isArray(d.items)||!d.items.length) process.exit(1)"
      - uses: actions/upload-artifact@v4
        with:
          name: pinflix-web
          path: dist
  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: test
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: pinflix-web
          path: dist
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
